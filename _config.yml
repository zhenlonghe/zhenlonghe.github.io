markdown: kramdown
permalink: /:year/:month/:day/:title.html

name: "Zhenlong"
author: "Zhenlong"
description: "Zhenlong 的个人博客：近况、技术记录、年度回顾与个人表达。"
atom-baseurl: "http://zhenlonghe.github.io"
disqus: "zhenlonghe"

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - todo
  - tools
  - vendor
  - reference_site.html
  - .impeccable

# 页眉导航只放图标；title 用作无障碍名称和悬停提示。
# 子页面在 front matter 里写 parent，导航会把父项标成当前页。
navigations:
  - title: 归档
    href: /archive.html
    icon: archive
  - title: 关于
    href: /about.html
    icon: user
  - title: RSS 订阅
    href: /atom.xml
    icon: rss
