{%- comment -%}
内联图标，替代原先的 Font Awesome。
原本为了 7 个图标要拉两个 CDN 样式表加一套 webfont，而且 _config.yml 里用的是
FA4 的类名，站上加载的是 FA6 —— 像 fa-comment-o 这种在 FA6 已经不存在，直接渲染成空白。

用法：{% include icon.html name="rss" %}
      {% include icon.html name="rss" class="foo" %}
{%- endcomment -%}
{%- assign n = include.name -%}
<svg class="icon {{ include.class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- case n -%}
{%- when "archive" -%}
<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>
{%- when "rss" -%}
<path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/>
{%- when "user" -%}
<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
{%- when "tags" -%}
<path d="M3 12.5V4.5A1.5 1.5 0 0 1 4.5 3h8l8.5 8.5-9.5 9.5z"/><circle cx="7.8" cy="7.8" r="1.3"/>
{%- when "arrow-left" -%}
<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>
{%- when "arrow-right" -%}
<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{%- when "copy" -%}
<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>
{%- when "check" -%}
<path d="M5 12.5l4.5 4.5L19 7"/>
{%- when "alert" -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/>
{%- when "comment" -%}
<path d="M20 15a2.5 2.5 0 0 1-2.5 2.5H8L4 21V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5z"/>
{%- when "github" -%}
<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5a5.4 5.4 0 0 0-1-3.5 5 5 0 0 0 0-3.5s-1 0-3 1.5a12.3 12.3 0 0 0-8 0C6 2 5 2 5 2a5 5 0 0 0 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5a4.8 4.8 0 0 0-1 3.5v4"/><path d="M9 18c-4.5 2-5-2-7-2"/>
{%- when "youtube" -%}
<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.2 9.6l5 2.4-5 2.4z" fill="currentColor" stroke="none"/>
{%- when "instagram" -%}
<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
{%- when "spotify" -%}
<circle cx="12" cy="12" r="9.2"/><path d="M7.4 9.3a11 11 0 0 1 9.2 1.1"/><path d="M8 12.5a8.6 8.6 0 0 1 7.3.9"/><path d="M8.6 15.5a6.4 6.4 0 0 1 5.6.7"/>
{%- else -%}
<circle cx="12" cy="12" r="8.5"/>
{%- endcase -%}
</svg>
